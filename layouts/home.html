{{ define "main" }}
  <div class="home-toolbar">
    <div class="home-heading">
      <h1>近期文章</h1>
      <p>技术、系统与长期笔记</p>
    </div>
    <section class="search-panel" data-search aria-label="站内搜索">
      <label class="visually-hidden" for="site-search">搜索文章</label>
      <input id="site-search" type="search" placeholder="搜索文章…" autocomplete="off" aria-controls="search-results">
      <div id="search-results" class="search-results" data-search-results aria-live="polite" hidden></div>
    </section>
  </div>

  {{ $posts := where site.RegularPages "Section" "posts" }}
  {{ $paginator := .Paginate $posts }}
  <section class="post-list" aria-label="近期文章">
    {{ range $paginator.Pages }}{{ partial "post-card.html" . }}{{ end }}
  </section>
  {{ partial "pagination.html" $paginator }}
{{ end }}
