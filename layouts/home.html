{{ define "main" }}
  <section class="intro">
    <p class="eyebrow">技术、系统与长期笔记</p>
    <h1>{{ site.Title }}</h1>
    <p>{{ site.Params.description }}</p>
  </section>

  <section class="search-panel" data-search>
    <label for="site-search">搜索文章</label>
    <input id="site-search" type="search" placeholder="输入标题、标签或正文关键词" autocomplete="off">
    <div class="search-results" data-search-results hidden></div>
  </section>

  {{ $posts := where site.RegularPages "Section" "posts" }}
  {{ $paginator := .Paginate $posts }}
  <section class="post-list" aria-label="近期文章">
    {{ range $paginator.Pages }}{{ partial "post-card.html" . }}{{ end }}
  </section>
  {{ partial "pagination.html" $paginator }}
{{ end }}
