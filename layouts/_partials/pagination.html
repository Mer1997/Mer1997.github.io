{{ if gt .TotalPages 1 }}
  <nav class="pagination" aria-label="分页">
    {{ with .Prev }}<a rel="prev" href="{{ .URL }}">← 较新</a>{{ else }}<span></span>{{ end }}
    <span>{{ .PageNumber }} / {{ .TotalPages }}</span>
    {{ with .Next }}<a rel="next" href="{{ .URL }}">较早 →</a>{{ else }}<span></span>{{ end }}
  </nav>
{{ end }}
