name: Check external blog links

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.165.0
        run: |
          wget -O "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}"
          sudo mv "${RUNNER_TEMP}/hugo" /usr/local/bin/hugo
      - name: Build
        run: hugo --gc --minify --panicOnWarning
      - name: Check internal and external links
        run: python3 scripts/check_links.py --external --report "$GITHUB_STEP_SUMMARY"
